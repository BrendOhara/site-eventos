<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Eventos do Tonhão</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">

    <!-- Card de Login -->
    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">

      <!-- Cabeçalho -->
      <div class="bg-orange-500 px-8 py-6 text-center">
        <h1 class="text-2xl font-bold text-white">Eventos do Tonhão</h1>
        <p class="text-orange-100 text-sm mt-1">Faça login para continuar</p>
      </div>

      <!-- Formulário -->
      <div class="p-8 space-y-5">

        <!-- E-mail -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
          <input type="email" placeholder="seuemail@exemplo.com"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent">
        </div>

        <!-- Senha -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
          <input type="password" placeholder="Digite sua senha"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent">
        </div>

        <!-- Lembrar de mim + Esqueci a senha -->
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" class="rounded text-orange-500">
            <span class="text-gray-600">Lembrar de mim</span>
          </label>
          <a href="#" class="text-orange-600 hover:text-orange-700 font-medium">Esqueci a senha</a>
        </div>

        <!-- Botão Entrar -->
        <button class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-lg transition">
          Entrar
        </button>

      </div>

      <!-- Rodapé -->
      <div class="bg-gray-50 px-8 py-4 text-center border-t">
        <p class="text-sm text-gray-600">
          Ainda não tem conta?
          <a href="#" class="text-orange-600 hover:text-orange-700 font-semibold">Criar conta</a>
        </p>
      </div>

    </div>

    <!-- Voltar -->
    <div class="text-center mt-6">
      <a href="index.html" class="text-sm text-gray-500 hover:text-orange-600">
        ← Voltar para os eventos
      </a>
    </div>

  </div>

</body>
</html>
